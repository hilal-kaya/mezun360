spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
    test-connection: false

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: mezun360-api
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mezun360}}
    username: ${DB_USERNAME:${POSTGRES_USER:mezun360}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: mezun360
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: mezun360
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: mezun360.spring_session
      cleanup-cron: "0 * * * * *"
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

mezun360:
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    cookie-name: ${SESSION_COOKIE_NAME:__Host-mezun360-session}
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    admin-mfa-required: ${ADMIN_MFA_REQUIRED:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
    alumni-idle: ${ALUMNI_SESSION_IDLE:30m}
    alumni-absolute: ${ALUMNI_SESSION_ABSOLUTE:8h}
    admin-idle: ${ADMIN_SESSION_IDLE:15m}
    admin-absolute: ${ADMIN_SESSION_ABSOLUTE:4h}
    account-attempts: ${AUTH_ACCOUNT_ATTEMPTS:5}
    source-attempts: ${AUTH_SOURCE_ATTEMPTS:30}
    rate-window: ${AUTH_RATE_WINDOW:5m}
    dev-users-enabled: ${DEV_USERS_ENABLED:false}
    dev-alumni-email: ${DEV_ALUMNI_EMAIL:}
    dev-alumni-password: ${DEV_ALUMNI_PASSWORD:}
    dev-admin-email: ${DEV_ADMIN_EMAIL:}
    dev-admin-password: ${DEV_ADMIN_PASSWORD:}
