components:
  schemas:
    CareerInput:
      type: object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - "null"
          format: uuid
        company:
          type: string
          maxLength: 150
          minLength: 0
        position:
          type: string
          maxLength: 150
          minLength: 0
        industry:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
        city:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
        startDate:
          type: string
          format: date
        endDate:
          type:
          - string
          - "null"
          format: date
        currentlyWorking:
          type: boolean
        description:
          type:
          - string
          - "null"
          maxLength: 2000
          minLength: 0
      required:
      - company
      - position
      - startDate
    CertificationInput:
      type: object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - "null"
          format: uuid
        name:
          type: string
          maxLength: 150
          minLength: 0
        issuer:
          type: string
          maxLength: 150
          minLength: 0
        year:
          type: integer
          format: int32
          minimum: 1900
        credentialUrl:
          type:
          - string
          - "null"
          maxLength: 2048
          minLength: 0
      required:
      - issuer
      - name
      - year
    ContributionInput:
      type: object
      additionalProperties: false
      properties:
        willingToMentor:
          type: boolean
        willingToShareOpportunities:
          type: boolean
        willingToSpeakAtEvents:
          type: boolean
        willingToSupportUniversityProjects:
          type: boolean
    EducationInput:
      type: object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - "null"
          format: uuid
        institution:
          type: string
          maxLength: 150
          minLength: 0
        department:
          type: string
          maxLength: 150
          minLength: 0
        degree:
          type: string
          maxLength: 100
          minLength: 0
        startYear:
          type: integer
          format: int32
          minimum: 1900
        graduationYear:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1900
      required:
      - degree
      - department
      - institution
      - startYear
    ProfileWrite:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          maxLength: 100
          minLength: 0
        department:
          type:
          - string
          - "null"
          maxLength: 150
          minLength: 0
        graduationYear:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1900
        city:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
        currentCompany:
          type:
          - string
          - "null"
          maxLength: 150
          minLength: 0
        currentPosition:
          type:
          - string
          - "null"
          maxLength: 150
          minLength: 0
        industry:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
        about:
          type:
          - string
          - "null"
          maxLength: 2000
          minLength: 0
        career:
          type: array
          items:
            $ref: "#/components/schemas/CareerInput"
          maxItems: 30
          minItems: 0
        education:
          type: array
          items:
            $ref: "#/components/schemas/EducationInput"
          maxItems: 20
          minItems: 0
        skills:
          type: array
          items:
            type: string
            maxLength: 60
            minLength: 0
          maxItems: 50
          minItems: 0
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/CertificationInput"
          maxItems: 30
          minItems: 0
        contribution:
          $ref: "#/components/schemas/ContributionInput"
      required:
      - career
      - certifications
      - contribution
      - education
      - firstName
      - lastName
      - skills
    ProfileResponse:
      type: object
      description: "Owner-only profile. exists=false has null data/timestamps and\
        \ completionPercentage=0. Education is user-entered, never institutionally\
        \ verified."
      properties:
        exists:
          type: boolean
        data:
          anyOf:
          - $ref: "#/components/schemas/ProfileWrite"
          - type: "null"
        completionPercentage:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
        createdAt:
          type:
          - string
          - "null"
          format: date-time
        updatedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - completionPercentage
      - createdAt
      - data
      - exists
      - updatedAt
    PrivacyWrite:
      type: object
      additionalProperties: false
      properties:
        directoryOptIn:
          type: boolean
        profileVisibility:
          type: string
          enum:
          - PRIVATE
          - ALUMNI_MEMBERS
      required:
      - directoryOptIn
      - profileVisibility
    PrivacyResponse:
      type: object
      properties:
        profileExists:
          type: boolean
        directoryOptIn:
          type: boolean
        profileVisibility:
          type: string
          enum:
          - PRIVATE
          - ALUMNI_MEMBERS
      required:
      - directoryOptIn
      - profileExists
      - profileVisibility
