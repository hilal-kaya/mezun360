openapi: 3.1.0
info:
  title: BTÜ Mezun360 API
  description: "Session authentication and M2B owner profile, privacy and audited\
    \ manual verification. Production MFA remains pending."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Jobs
  description: Alumni Job Board API
- name: Mentorship
  description: Alumni Mentorship API
paths:
  /api/v1/me/profile:
    get:
      tags:
      - profile-controller
      summary: Read current ALUMNI owner's profile or empty onboarding state
      operationId: getOwnProfile
      responses:
        "200":
          description: Owner-only profile; no account/contact/verification fields
          headers:
            ETag:
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "403":
          description: "CSRF token invalid, CORS rejected or access forbidden."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error; sanitized detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "503":
          description: Required dependency unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Authentication required or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - sessionCookie: []
    put:
      tags:
      - profile-controller
      summary: Atomically replace editable profile and bounded nested records; ALUMNI
        owner only
      operationId: replaceOwnProfile
      parameters:
      - name: If-Match
        in: header
        description: "Exact ETag from GET, including the empty onboarding tag for\
          \ initial creation."
        required: true
        schema:
          type: string
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
        required: true
      responses:
        "200":
          description: Saved owner profile
          headers:
            ETag:
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          description: Validation failed or version precondition missing/stale.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "412":
          description: Validation failed or version precondition missing/stale.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "428":
          description: Validation failed or version precondition missing/stale.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "CSRF token invalid, CORS rejected or access forbidden."
          content:
            application/problem+json:
